version: "3.9"

services:
  web:
    build: .
    container_name: toss_analytics_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./_backups:/app/_backups
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  scheduler:
    build: .
    container_name: toss_analytics_scheduler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./_backups:/app/_backups
      - ./logs:/app/logs
    command: python run.py --scheduler

  telegram:
    build: .
    container_name: toss_analytics_telegram
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python run.py --telegram

